<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클릭 견적서 — 견적서 · 거래명세서 · 청구서 만들기</title>
    <meta name="description" content="설치 없이 브라우저에서 바로 만드는 견적서, 거래명세서, 청구서. 입력한 정보는 서버로 전송되지 않습니다.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── 상단 툴바 (인쇄 시 숨김) ────────────────────────────── -->
<div class="toolbar no-print">
    <div class="toolbar-inner">
        <div class="brand">
            <span class="brand-mark">📄</span>
            <span class="brand-name">클릭 견적서</span>
        </div>

        <div class="doctype" role="tablist" aria-label="문서 종류">
            <button class="doctype-btn is-active" data-doctype="견적서" role="tab">견적서</button>
            <button class="doctype-btn" data-doctype="거래명세서" role="tab">거래명세서</button>
            <button class="doctype-btn" data-doctype="청구서" role="tab">청구서</button>
        </div>

        <div class="toolbar-actions">
            <label class="btn btn-ghost" title="상단 로고 이미지 넣기">
                로고
                <input type="file" id="logo-input" accept="image/*" hidden>
            </label>
            <label class="btn btn-ghost" title="도장 또는 서명 이미지 넣기">
                도장
                <input type="file" id="stamp-input" accept="image/*" hidden>
            </label>
            <button class="btn btn-ghost" id="btn-save" title="이 브라우저에 저장">저장</button>
            <button class="btn btn-ghost" id="btn-open" title="저장한 문서 불러오기">불러오기</button>
            <button class="btn btn-ghost" id="btn-export" title="파일로 백업">내보내기</button>
            <label class="btn btn-ghost" title="백업 파일 불러오기">
                가져오기
                <input type="file" id="import-input" accept="application/json,.json" hidden>
            </label>
            <button class="btn btn-ghost btn-danger" id="btn-reset" title="빈 문서로 시작">새 문서</button>
            <button class="btn btn-primary" id="btn-print">인쇄 / PDF 저장</button>
        </div>
    </div>
    <div class="toolbar-note">
        입력한 내용은 이 브라우저 안에만 저장됩니다. 서버로 전송되지 않습니다.
    </div>
</div>

<!-- ── A4 문서 ──────────────────────────────────────────── -->
<main class="stage">
  <article class="paper" id="paper">

    <header class="doc-head">
        <div class="logo-slot">
            <img id="logo-img" alt="" hidden>
            <span class="logo-hint no-print">로고 없음</span>
        </div>
        <h1 class="doc-title" id="doc-title">견적서</h1>
        <table class="doc-meta">
            <tr><th>문서번호</th><td><input data-field="docNo" placeholder="2026-0001"></td></tr>
            <tr><th>작 성 일</th><td><input data-field="docDate" placeholder="2026-08-01"></td></tr>
        </table>
    </header>

    <section class="parties">
        <div class="party party-client">
            <div class="client-line">
                <input data-field="clientName" class="client-name" placeholder="상호 또는 담당자명">
                <span class="honorific">귀하</span>
            </div>
            <label class="field"><span>담 당 자</span><input data-field="clientManager" placeholder="홍길동 대리"></label>
            <label class="field"><span>연 락 처</span><input data-field="clientContact" placeholder="010-0000-0000"></label>
            <label class="field"><span>이 메 일</span><input data-field="clientEmail" placeholder="client@example.com"></label>
            <p class="lead" id="lead-text">아래와 같이 견적합니다.</p>
        </div>

        <div class="party party-supplier">
            <table class="supplier-table">
                <tr>
                    <th rowspan="6" class="vertical">공<br>급<br>자</th>
                    <th>등록번호</th>
                    <td colspan="3"><input data-field="bizNo" placeholder="000-00-00000"></td>
                </tr>
                <tr>
                    <th>상 호</th>
                    <td><input data-field="company" placeholder="회사명"></td>
                    <th>성 명</th>
                    <td class="stamp-cell">
                        <input data-field="ceo" placeholder="대표자">
                        <img id="stamp-img" class="stamp" alt="" hidden>
                    </td>
                </tr>
                <tr><th>사업장<br>주소</th><td colspan="3"><input data-field="address" placeholder="주소"></td></tr>
                <tr>
                    <th>업 태</th><td><input data-field="bizType" placeholder="서비스업"></td>
                    <th>종 목</th><td><input data-field="bizItem" placeholder="소프트웨어 개발"></td>
                </tr>
                <tr>
                    <th>전 화</th><td><input data-field="tel" placeholder="02-0000-0000"></td>
                    <th>이메일</th><td><input data-field="email" placeholder="me@example.com"></td>
                </tr>
                <tr><th>입금계좌</th><td colspan="3"><input data-field="bank" placeholder="○○은행 000-000000-00-000 예금주"></td></tr>
            </table>
        </div>
    </section>

    <div class="grand-line">
        <span class="grand-label">합계금액</span>
        <span class="grand-hangul" id="grand-hangul">일금 영원정</span>
        <span class="grand-digit" id="grand-digit">(₩0)</span>
    </div>

    <table class="items">
        <thead>
            <tr>
                <th class="c-no">No</th>
                <th class="c-name">품 목</th>
                <th class="c-spec">규 격</th>
                <th class="c-qty">수량</th>
                <th class="c-price">단 가</th>
                <th class="c-amount">공급가액</th>
                <th class="c-note">비 고</th>
                <th class="c-del no-print"></th>
            </tr>
        </thead>
        <tbody id="items-body"></tbody>
    </table>

    <div class="items-actions no-print">
        <button class="btn btn-ghost btn-sm" id="btn-add-row">＋ 항목 추가</button>
        <span class="hint">Tab 키로 칸 이동 · 수량 × 단가는 자동 계산됩니다</span>
    </div>

    <section class="summary">
        <div class="notes">
            <div class="notes-title">특기사항</div>
            <textarea data-field="notes" rows="5" placeholder="· 본 견적의 유효기간은 발행일로부터 30일입니다.&#10;· 결제 조건: 계약금 50%, 잔금 50%&#10;· 납기, 부가세 별도 여부 등 조건을 적어주세요."></textarea>
        </div>
        <table class="sums">
            <tr><th>공 급 가 액</th><td id="sum-supply">0</td></tr>
            <tr class="vat-row">
                <th>
                    <label class="vat-toggle no-print"><input type="checkbox" id="vat-check" checked> 부가세</label>
                    <span class="print-only">부 가 세</span>
                </th>
                <td id="sum-vat">0</td>
            </tr>
            <tr class="sum-total"><th>합 계</th><td id="sum-total">0</td></tr>
        </table>
    </section>

    <footer class="doc-foot">
        <input data-field="footer" class="foot-input" placeholder="회사 슬로건 · 홈페이지 · 안내 문구 등 자유롭게 입력">
    </footer>

  </article>
</main>

<!-- ── 저장 문서 목록 모달 ──────────────────────────────── -->
<div class="modal no-print" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">저장된 문서</h2>
        <ul class="doc-list" id="doc-list"></ul>
        <div class="modal-foot">
            <button class="btn btn-ghost" id="btn-close-modal">닫기</button>
        </div>
    </div>
</div>

<div class="toast no-print" id="toast" hidden></div>

<script src="main.js"></script>
</body>
</html>
